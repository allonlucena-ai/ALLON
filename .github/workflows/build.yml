name: Build ALLON APK
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extrair projeto
        run: unzip -q ALLON-para-github.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Instalar componentes Android
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.13113456" "cmake;3.31.6"
      - name: Baixar submódulos nas versões certas
        run: |
          git clone --depth 1 --branch visionos-fix --recurse-submodules --shallow-submodules https://github.com/ItzSkyeYT/InterTune.git /tmp/upstream
          for d in ffMetadataEx taglib innertubex; do
            rm -rf InterTune-visionos-fix/$d
            cp -r /tmp/upstream/$d InterTune-visionos-fix/$d
            rm -rf InterTune-visionos-fix/$d/.git
          done
      - name: Compilar
        working-directory: InterTune-visionos-fix
        run: |
          chmod +x ./gradlew
          ./gradlew assembleCoreDebug --no-daemon --console=plain > build.log 2>&1 || (echo "=== ERRO ==="; grep -n -B2 -A25 "What went wrong" build.log | head -80; grep -n "^e: \|error:" build.log | head -30; exit 1)
      - uses: actions/upload-artifact@v4
        with:
          name: ALLON-debug-APK
          path: InterTune-visionos-fix/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
